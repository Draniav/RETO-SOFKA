serenity {
  project.name = "OpenCart - Compra E2E como invitado"
  take.screenshots = AFTER_EACH_STEP
  encoding = "UTF-8"
  compress.filenames = true
}

webdriver {
  driver = chrome
  autodownload = true
  timeouts {
    implicitlywait = 5000
    fluentwait = 15000
  }
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["remote-allow-origins=*", "start-maximized", "incognito", "disable-infobars",
              "disable-gpu", "disable-default-apps", "disable-popup-blocking", "window-size=1920,1080"]
    }
  }
}

# Para ejecutar sin interfaz gráfica: gradle clean test -Dheadless.mode=true
headless.mode = false

environments {
  default {
    webdriver.base.url = "http://opencart.abstracta.us/"
  }
}
